name: Update Zed Package

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Zed version to package (e.g. 0.223.3). Leave empty for latest."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="$(echo "${INPUT_VERSION}" | sed 's/^[[:space:]]*v\?//; s/[[:space:]]*$//')"
          else
            VERSION=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/zed-industries/zed/releases/latest" \
              | jq -r ".tag_name" | sed "s/^v//")
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to determine Zed version from GitHub API"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Find current revision for this version from tags
          LATEST_TAG=$(git tag -l "v${VERSION}-*" --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            CURRENT_REV=$(echo "$LATEST_TAG" | sed "s/v${VERSION}-//")
          else
            CURRENT_REV=0
          fi

          if [ -n "${INPUT_VERSION}" ]; then
            NEW_REV=$((CURRENT_REV + 1))
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger with version ${VERSION}, revision ${NEW_REV}."
          elif [ "$CURRENT_REV" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already packaged (rev ${CURRENT_REV}), skipping."
          else
            NEW_REV=1
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version: ${VERSION}-${NEW_REV}"
          fi

          echo "revision=${NEW_REV:-}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          ./scripts/build-deb.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.revision }}"

      - name: Import GPG key
        if: steps.version.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Test .deb package
        if: steps.version.outputs.skip != 'true'
        run: |
          DEB=$(ls packages/zed_*.deb)
          echo "=== Package structure ==="
          dpkg-deb -c "$DEB" | grep -E '(usr/bin/zed|usr/lib/zed/bin/zed|usr/lib/zed/libexec/zed-editor|usr/share/applications/dev.zed.Zed.desktop)'

          echo "=== Verifying required files ==="
          for path in ./usr/bin/zed ./usr/lib/zed/bin/zed ./usr/lib/zed/libexec/zed-editor ./usr/share/applications/dev.zed.Zed.desktop; do
            if ! dpkg-deb -c "$DEB" 2>/dev/null | grep -q "$path"; then
              echo "MISSING: $path"
              exit 1
            fi
          done
          echo "All required files present."

          echo "=== Test install ==="
          sudo dpkg -i "$DEB" || sudo apt-get install -f -y

          echo "=== Test CLI ==="
          zed --version

          echo "=== Check library dependencies ==="
          ldd /usr/lib/zed/libexec/zed-editor | grep "not found" && exit 1 || echo "All libraries resolved."

      - name: Update APT repository
        if: steps.version.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          ./scripts/update-repo.sh

      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}-${{ steps.version.outputs.revision }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Upload repo artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  deploy-pages:
    needs: check-and-build
    if: needs.check-and-build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
