# inner podman: no systemd, no cgroup delegation, and the network namespace of the sandbox,
# so the sandbox firewall applies to every inner container as well
[containers]
netns = "host"
utsns = "host"
ipcns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
